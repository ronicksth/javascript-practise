<html>
	<head>
		<title>hello</title>
	</head>
	<body>
		<h1>Hello World</h1>
		<button type="button" onclick="time()">Click me to display Date and Time.</button>
		<p id="demo"></p>
		<script>
			function time() {
				document.getElementById('demo').innerHTML = Date();
			}
		</script>
	</body>
</html>
