<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>hide text</title>
</head>
<body>
	<h1>Hide the written text</h1>
	<p id="hide">Hello World</p>
	<button type="button" onclick="hideText()">click me to hide!</button>
	<script>
		function hideText() {
			document.getElementById('hide').style.display='none';
		}
	</script>
</body>
</html>
