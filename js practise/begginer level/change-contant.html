<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Change-text</title>
</head>
<body>
	<p id="demo">I can change the text</p>
	<button type="button" onclick="Change_text()">Click me to change!</button>
	<script>
		function Change_text() {
			document.getElementById("demo").innerHTML = "The Text is changed";
		}
	</script>
</body>
</html>
