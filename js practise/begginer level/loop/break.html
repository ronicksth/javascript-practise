<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Break</title>
</head>
<body>
	<h1>Break</h1>
	<input type="text" placeholder="enter the text to loop" id="looping"><br><br>
	<input type="number" placeholder="enter the amount to loop" id="loopamount"><br>
	<button type="button" onclick="looper()">Enter</button>
	<p id="output"></p>
	<script>
		function looper() {
			let x,y,z;
			x = document.getElementById('looping').value;
			y = document.getElementById('loopamount').value;
			z = "";
			for (let i = 0; i <= y; i++) {
				if (y === 50) { 
					break;
					}
				z += i + "." + " " + x + "<br>";
			}
			document.getElementById('output').innerHTML = z;
		}
	</script>
</body>
</html>
