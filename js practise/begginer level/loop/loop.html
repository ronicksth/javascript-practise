<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>looping</title>
</head>
<body>
	<h1>Looping</h1>
	<p id="return"></p>
	<script>
		let text = "";
		for (let i = 1;i <= 100; i++) {
			text += i +"."+ " " + "Hello" + "<br>";
		}
		document.getElementById('return').innerHTML = text;
	</script>
</body>
</html>
