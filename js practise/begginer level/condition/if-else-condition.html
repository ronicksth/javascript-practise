<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>if else condition</title>
	<style>
		body{
			text-align: center;
		}
		input{
			text-align: center;
		}
	</style>
</head>
<body>
	<h1>If-Else condition</h1>
	<input type="number" placeholder="Enter your Age" id="age"></body><br>
	<button type="button" onclick="driveablechecker()">Submit!</button>
	<script>
		function driveablechecker() {
			let age = document.getElementById('age').value;

			if (age>=18) {
				alert('You can drive');
			}else{
				alert('You cannot drive');
			}
		}
	</script>
</body>
</html>
