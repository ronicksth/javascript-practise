<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ternary-operatiors</title>
	<style>
		body{
			text-align: center;
		}
		input{
			text-align: center;
		}
	</style>
</head>
<body>
	<h1>Ternary Operators</h1>
	<input type="number" placeholder="Enter your Age" id="age"><br>
	<button type="button" onclick="examine()">Click me!</button><br>
	<p id="output"></p>
	<script>
		function examine() {
			let age = document.getElementById('age').value
			if (age>=18) {
				document.getElementById('output').innerHTML='He/She is elegible to drive'
			}else{
				document.getElementById('output').innerHTML='He/She isnot elegible to drive'
			}
		}
	</script>
</body>
</html>
