<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>font-size-change</title>
	<style>
		body{
			text-align: center;
		}
	</style>
</head>
<body>
	<h1>Font size change</h1>
	<p id="change">Hello World</p>
	<button type="button" onclick="Change()">Click me to change!</button>
	<script>
		function Change() {
			document.getElementById('change').style.fontSize = '35px';
		}
	</script>
</body>
</html>
