<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>javascript variable</title>
</head>
<body>
	<p id="demo">what's 10+12</p>
	<button type="button" onclick="variable()">click me!</button>
	<script>
		function variable() {
			let x,y,z;
			x = 10;
			y = 12;
			z = x + y;
			document.getElementById('demo').innerHTML = 'its '+z;
			alert('You have been haked jk jk jk')
		}
	</script>
</body>
</html>
