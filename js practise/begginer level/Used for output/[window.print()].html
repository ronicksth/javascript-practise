<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>window.print()</title>
</head>
<body>
	<h1>My Web Page</h1>
	<p>Hello World</p>
	<button type="button" onclick="printout()">click me to print out this page!</button>
	<script>
		function printout() {
			window.print();
		}
	</script>
</body>
</html>
