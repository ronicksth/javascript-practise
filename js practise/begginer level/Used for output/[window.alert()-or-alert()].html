<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>window.alert() or alert()</title>
</head>
<body>
	<h1>My Web Page</h1>
	<p>Hello world</p>
	<button type="button" onclick="showMessage()">click me!</button>
	<script>
		function showMessage() {
			alert('why did you clicked me!');
		}
	</script>
</body>
</html>
