<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Using Button in document.write()</title>
</head>
<body>
	<h1>My Web Page</h1>
	<p>Hello World</p>
	<button type="button" onclick="showresult()">Click me!</button>
	<script>
		function showresult() {
			document.write('Why did you clicked me!');
		}
	</script>
</body>
</html>
